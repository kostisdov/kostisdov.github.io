<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 416" width="900" height="416" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="416" fill="#fbfaf8"/>
  <text x="150" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#221e17">Decoupled architecture</text>
  <path d="M30,30 H270" stroke="#221e17" stroke-width="1.2" fill="none"/>
  <text x="600" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#221e17">Coupled architecture</text>
  <path d="M330,30 H870" stroke="#221e17" stroke-width="1.2" fill="none"/>
  <defs>
    <g id="dip"><path d="M0,0 V44 M0,52 V96" stroke="#221e17" stroke-width="3" stroke-linecap="round" fill="none"/></g>
    <g id="match"><rect x="-27" y="0" width="54" height="30" fill="#fbfaf8" stroke="#5c554a" stroke-width="1.1" rx="2"/><text x="0" y="20" text-anchor="middle" font-size="12" fill="#221e17">match</text></g>
    <g id="src"><circle cx="0" cy="0" r="10" fill="#fbfaf8" stroke="#5c554a" stroke-width="1.1"/><text x="0" y="4" text-anchor="middle" font-size="9.5" fill="#221e17">Rx</text></g>
  </defs>

  <g transform="translate(150,44)">
    <text x="0" y="28" text-anchor="middle" font-size="16" fill="#221e17">Element decoupling</text>
    <text x="0" y="48" text-anchor="middle" font-size="13" font-style="italic" fill="#5c554a">changes the antennas</text>
    <use href="#src" x="-58" y="82"/><use href="#src" x="58" y="82"/>
    <path d="M-58,92 V128 M58,92 V128 M-58,158 V214 M58,158 V214" stroke="#5c554a" stroke-width="1.1" fill="none"/>
    <use href="#match" x="-58" y="128"/><use href="#match" x="58" y="128"/>
    <use href="#dip" x="-58" y="214"/><use href="#dip" x="58" y="214"/>
    <path d="M0,214 V310" stroke="#c34a22" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="-7" y="256" width="14" height="12" fill="#fbfaf8" stroke="#c34a22" stroke-width="1.2"/>
    <text x="0" y="205" text-anchor="middle" font-size="12" font-style="italic" fill="#c34a22">loaded parasitic</text>
    <text x="0" y="338" text-anchor="middle" font-size="13" fill="#221e17">Z changes, S₂₁ falls</text>
    <text x="0" y="356" text-anchor="middle" font-size="13" fill="#5c554a">element patterns change</text>
  </g>

  <g transform="translate(450,44)">
    <text x="0" y="28" text-anchor="middle" font-size="16" fill="#221e17">Port decoupling</text>
    <text x="0" y="48" text-anchor="middle" font-size="13" font-style="italic" fill="#5c554a">adds a network, keeps the antennas</text>
    <use href="#src" x="-58" y="82"/><use href="#src" x="58" y="82"/>
    <path d="M-58,92 V118 M58,92 V118 M-58,168 V214 M58,168 V214" stroke="#5c554a" stroke-width="1.1" fill="none"/>
    <rect x="-90" y="118" width="180" height="50" fill="#fbfaf8" stroke="#c34a22" stroke-width="1.5" rx="2"/>
    <text x="0" y="139" text-anchor="middle" font-size="13" fill="#221e17">lossless 2N-port network</text>
    <text x="0" y="157" text-anchor="middle" font-size="13" font-style="italic" fill="#5c554a">every port to every element</text>
    <use href="#dip" x="-58" y="214"/><use href="#dip" x="58" y="214"/>
    <path d="M-48,262 C-20,240 20,240 48,262 M-48,270 C-20,292 20,292 48,270" stroke="#5c554a" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
    <text x="0" y="205" text-anchor="middle" font-size="12" font-style="italic" fill="#5c554a">still coupled</text>
    <text x="0" y="338" text-anchor="middle" font-size="13" fill="#221e17">Z unchanged, S = 0</text>
    <text x="0" y="356" text-anchor="middle" font-size="13" fill="#5c554a">no reflection for any weights</text>
  </g>

  <g transform="translate(750,44)">
    <text x="0" y="28" text-anchor="middle" font-size="16" fill="#221e17">Digital compensation</text>
    <text x="0" y="48" text-anchor="middle" font-size="13" font-style="italic" fill="#5c554a">changes only the weights</text>
    <rect x="-90" y="64" width="180" height="34" fill="#fbfaf8" stroke="#c34a22" stroke-width="1.5" rx="2"/>
    <text x="0" y="86" text-anchor="middle" font-size="13" fill="#221e17">weights from measurements</text>
    <path d="M-58,98 V128 M58,98 V128 M-58,158 V214 M58,158 V214" stroke="#5c554a" stroke-width="1.1" fill="none"/>
    <use href="#match" x="-58" y="128"/><use href="#match" x="58" y="128"/>
    <use href="#dip" x="-58" y="214"/><use href="#dip" x="58" y="214"/>
    <path d="M-48,262 C-20,240 20,240 48,262 M-48,270 C-20,292 20,292 48,270" stroke="#5c554a" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
    <text x="0" y="205" text-anchor="middle" font-size="12" font-style="italic" fill="#5c554a">still coupled</text>
    <text x="0" y="338" text-anchor="middle" font-size="13" fill="#221e17">Z and S unchanged</text>
    <text x="0" y="356" text-anchor="middle" font-size="13" fill="#5c554a">weights only</text>
  </g>
</svg>
